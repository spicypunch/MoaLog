name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiplatform-and-server:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run KMP, Android unit, iOS simulator, and H2 server tests
        run: >-
          ./gradlew
          :core:contracts:allTests
          :core:model:allTests
          :core:network:allTests
          :core:database:allTests
          :feature:home:allTests
          :feature:setup:allTests
          :feature:records:allTests
          :feature:plan:allTests
          :feature:assets:allTests
          :feature:maintenance:allTests
          :app-shell:testDebugUnitTest
          :shared:allTests
          :server:test
          --no-configuration-cache

  android-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :core:database:connectedDebugAndroidTest --no-configuration-cache

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run Flyway and PostgreSQL concurrency tests
        run: ./gradlew :server:postgresIntegrationTest --no-configuration-cache
